name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**/*.py'
      - 'requirements.txt'
      - '.github/workflows/build-windows.yml'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Run converter tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests (no GUI dependency needed)
        run: python -m unittest discover -s tests -v

  build:
    name: Package Windows EXE
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller==6.16.0
      - name: Import PySide6 GUI
        run: python -c "import sql_converter.gui; print('GUI dependencies OK')"
      - name: Build standalone executable
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name SQLConverter main.py
      - name: Check EXE exists
        shell: pwsh
        run: |
          if (!(Test-Path 'dist/SQLConverter.exe')) { throw 'EXE not found' }
          Get-Item 'dist/SQLConverter.exe' | Select-Object Name, Length
      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: SQLConverter-Windows-x64
          path: dist/SQLConverter.exe
          if-no-files-found: error
          retention-days: 30
